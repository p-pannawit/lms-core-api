name: salung-api-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salung
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salung"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
